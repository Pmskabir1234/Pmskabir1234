name: Generate Language Stats

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight
  workflow_dispatch:        # lets you trigger it manually too

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate Language Stats Card
        uses: antonkomarev/github-profile-views-counter@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and generate pie chart
        run: |
          pip install requests matplotlib numpy
          python generate_chart.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Pmskabir1234

      - name: Commit chart
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add lang-stats.svg
          git diff --cached --quiet || git commit -m "chore: update language stats chart"
          git push
